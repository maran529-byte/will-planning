# ============================================================
# AI Will Planner — 大陆 Tencent Cloud Nginx 配置（合规收紧版）
# Domain: aiwill-planner.cn / www.aiwill-planner.cn
# IP    : 124.222.215.107
# 原则  ：本节点仅提供 5 个静态页面，绝不反向代理任何境外端点
#         所有动态/AI 能力只能通过 h5.aiwill-planner.cn → 43.129.207.154
# ============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml;

    # 限流（防爬虫）
    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=30r/s;

    # ============================================================
    # HTTP（80）—— 只服务 5 个静态路径，无任何 proxy_pass
    # ============================================================
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name aiwill-planner.cn www.aiwill-planner.cn 124.222.215.107;

        # 网信办备案头（部分地区合规要求显式标识）
        add_header X-Beian "沪ICP备2026020925号-1" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://aiwill-planner.vercel.app" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/aiwill-planner;
        index index.html;
        charset utf-8;

        limit_req zone=static_zone burst=60 nodelay;

        # ----- 1. 首页 -----
        location = / {
            alias /var/www/aiwill-planner/;
            try_files $uri/index.html =404;
        }

        # ----- 2. /faq -----
        location = /faq {
            alias /var/www/aiwill-planner/static-content/;
            try_files $uri.html =404;
        }

        # ----- 3. /tutorial -----
        location = /tutorial {
            alias /var/www/aiwill-planner/static-content/;
            try_files $uri.html =404;
        }

        # ----- 4. /compare -----
        location = /compare {
            alias /var/www/aiwill-planner/static-content/;
            try_files $uri.html =404;
        }

        # ----- 5. /tool -----
        location = /tool {
            alias /var/www/aiwill-planner/static-content/;
            try_files $uri.html =404;
        }

        # ----- SEO/收录 -----
        location = /robots.txt   { root /var/www/aiwill-planner; }
        location = /sitemap.xml  { root /var/www/aiwill-planner; }
        location = /favicon.ico  { root /var/www/aiwill-planner; access_log off; log_not_found off; }

        # ----- 健康检查（运维用） -----
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }

        # ----- 静态资源（图片/CSS）-----
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ============================================================
        # ❌ 合规死线：禁止任何 proxy_pass，禁止 / 与 /api/* 反代境外
        # 任何其他路径一律返回 404，不暴露端点
        # ============================================================
        location / {
            return 404;
        }

        location /api/ {
            # 大陆节点不再承接 API，统一引导到 h5 子域
            return 301 https://h5.aiwill-planner.cn$request_uri;
        }

        # 错误页
        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 '页面不存在 | <a href="/">返回首页</a>';
            add_header Content-Type text/html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }
}
