name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # Vercel 端点要求 CLI >= 47.2.2 (2025-10 起), 但 vercel-action@v25 内部
      # 仍固定调用老版 CLI. 这里显式 npx -y 拉最新版, 绕过 action 内的版本锁.
      # 改版 v14 (2026-08-01): 加 --force 强制新部署, 解决 _next/static/chunks/ 旧 chunk
      #   被 Vercel CDN 边缘节点长期缓存, 自定义域 (h5.aiwill-planner.cn) 用户仍看到旧 UI.
      #   --force 跳过 build cache, 重新生成所有 chunk, 全局生效.
      # 改版 v15 (2026-08-01): 加 promote 步骤, 强制让 h5.aiwill-planner.cn 自定义域
      #   CDN 切到新部署. vercel deploy --prod 默认只更新 vercel.app 域, 自定义域可能
      #   仍 sticky 在老 deployment.
      - name: Deploy to Vercel
        id: deploy
        run: |
          set -e
          echo "=== Running vercel deploy --prod --force ==="
          npx -y vercel@latest deploy --prod --force \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --yes 2>&1 | tee /tmp/deploy.log
          # vercel deploy 输出最后一行是 "Production: https://xxx.vercel.app [2s]"
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9_-]+\.vercel\.app' /tmp/deploy.log | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "  → captured: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Promote deployment to all custom domains
        if: steps.deploy.outputs.deploy_url != ''
        run: |
          echo "Promoting ${{ steps.deploy.outputs.deploy_url }} → current"
          npx -y vercel@latest promote "${{ steps.deploy.outputs.deploy_url }}" \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --yes 2>&1 | tee /tmp/promote.log
          echo "✅ Promote complete"

      # 改版 v16 (2026-08-02): promote 后立刻 invalidate h5 子域 CDN cache
      #   原因: promote 只切 deployment alias, 但 Vercel CDN 边缘节点上的
      #   HTML 响应仍可能缓存老 deployment 的内容 (cache-control 30 天).
      #   invalidate 强制让所有边缘节点下次请求回源.
      - name: Invalidate h5.aiwill-planner.cn CDN cache
        if: steps.deploy.outputs.deploy_url != ''
        run: |
          echo "=== Invalidating Vercel CDN cache for h5 subdomain ==="
          PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"
          # vercel-cli 没有 invalidate 子命令, 用 curl 直接打 Vercel REST API
          # POST /v1/projects/{id}/cache/purge?domain=h5.aiwill-planner.cn
          curl -sS -X POST \
            "https://api.vercel.com/v1/projects/${PROJECT_ID}/cache/purge" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"domain":"h5.aiwill-planner.cn"}' \
            | tee /tmp/invalidate.log
          echo ""
          echo "✅ h5.aiwill-planner.cn CDN cache invalidated"
