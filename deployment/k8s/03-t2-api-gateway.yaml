apiVersion: apps/v1
kind: Deployment
metadata:
  name: t2-api-gateway
  namespace: aiwill-planner
  labels:
    app: t2-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: t2-api-gateway
  template:
    metadata:
      labels:
        app: t2-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: aiwill-planner/t2-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aiwill-config
            - secretRef:
                name: aiwill-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: t2-api-gateway
  namespace: aiwill-planner
spec:
  selector:
    app: t2-api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer