        location = /humans.txt           { root /var/www/aiwill-planner/public; charset utf-8; }
        location = /for-citations.txt    { root /var/www/aiwill-planner/public; charset utf-8; }
        location = /editorial-policy.txt { root /var/www/aiwill-planner/public; charset utf-8; }

        # 改版 v33 (2026-08-05): 修 /dashboard /login /register /account 死循环
        #   - 症状 (用户报告): 电脑端 (桌面 UA) 访问 h5.aiwill-planner.cn/dashboard 显示
        #     "该网页无法正常运作 h5.aiwill-planner.cn 将您重定向的次数过多"
        #   - 根因:
        #     1) H5 子域 catch-all `location /` 在 $desktop_ua=1 时强制 302 → aiwill-planner.cn/dashboard
        #     2) PC 域 v29 配置 `/dashboard` 又是 302 → h5.aiwill-planner.cn/dashboard
        #     3) 桌面 UA 进 H5/dashboard → 1 → 2 → 1 → 2 ... 死循环
        #   - 修复: 把 PC 域这 4 个路径改为 proxy_pass 到 nextjs, 渲染静态跳转卡
        #     (src/app/dashboard/page.tsx 等已是合规的静态展示页, 含"前往 H5"按钮)
        #   - 移动 UA 走 PC catch-all `location /` 的 mobile_ua 分支, 仍 302 → H5 (保留)
        #   - 桌面 UA 在 PC 域直接看到静态跳转卡, 不再死循环
        location /dashboard {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        location /login {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        location /register {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        location /account {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        # 改版 v31 (2026-08-04): 补 /contact /custom 302 → H5
        #   - 触发: 用户视角体检 - /contact /custom 没 302 配置, 兜底 404
        #   - 引用: 10+ 处 <Link href="/contact"> (guide/tutorial/result 等页面)
        #   - 修复: 与 /login /register 一致 302 → H5
        location /contact {
            return 302 https://h5.aiwill-planner.cn$request_uri;
        }
        location /custom {
            return 302 https://h5.aiwill-planner.cn$request_uri;
        }
        location /about {
            proxy_pass http://nextjs_local;
