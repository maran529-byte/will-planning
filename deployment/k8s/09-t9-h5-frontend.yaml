apiVersion: apps/v1
kind: Deployment
metadata:
  name: t9-h5-frontend
  namespace: aiwill-planner
  labels:
    app: t9-h5-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: t9-h5-frontend
  template:
    metadata:
      labels:
        app: t9-h5-frontend
    spec:
      containers:
        - name: h5-frontend
          image: aiwill-planner/t9-h5-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: t9-h5-frontend
  namespace: aiwill-planner
spec:
  selector:
    app: t9-h5-frontend
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer