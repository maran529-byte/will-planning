# ============================================================
# AI Will Planner — 大陆 Tencent Cloud Nginx 配置（合规收紧 + 本地 Node 承载 admin/api）
# Domain: aiwill-planner.cn / www.aiwill-planner.cn
# IP    : 124.222.215.107
# 原则  :
#   1) 静态首页/4 内容页/SEO 文件直接由 nginx 提供 (零依赖)
#   2) /admin/* 与 /api/* 反向代理到本机 127.0.0.1:3000 (本地 Node, 不出境)
#      - Next.js (PM2) 跑在 /opt/aiwill-app, 监听 127.0.0.1:3000
#      - Supabase 自建在 /opt/aiwill-supabase (Kong @ 10.0.0.4:8000), 同样在大陆内网
#      - 整个调用链: 用户 → 124.222.215.107:443 → 127.0.0.1:3000 → 10.0.0.4:8000 (全部境内)
#   3) 严禁任何出境的 proxy_pass (例如 Vercel / GitHub Pages / 任何海外 SaaS)
#   4) CSP 同步允许同源 + 本地回环, 但禁止 connect 任何境外域名
# ============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml application/json;

    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

    # 改版 v8 (2026-06-21): H5 子域 sitemap/robots 走 Next.js,
    # 解决百度"索引型 sitemap"误判 (PC 用 root 文件, H5 用 Next.js 输出)
    map $host $sitemap_upstream {
        default "root";
        h5.aiwill-planner.cn "nextjs";
    }

    upstream nextjs_local {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name aiwill-planner.cn www.aiwill-planner.cn 124.222.215.107;

        return 301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name aiwill-planner.cn www.aiwill-planner.cn;

        ssl_certificate     /etc/letsencrypt/live/aiwill-planner.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aiwill-planner.cn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        add_header X-Beian "沪ICP备2026020925号-1";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://127.0.0.1:3000; frame-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/aiwill-planner;
        index index.html;
        charset utf-8;

        limit_req zone=static_zone burst=60 nodelay;

        # ===== A) 静态页面 (直出) =====
        location = / { try_files /index.html =404; }
        location = /faq      { try_files /static-content/faq.html =404; }
        location = /tutorial { try_files /static-content/tutorial.html =404; }
        location = /compare  { try_files /static-content/compare.html =404; }
        location = /tool     { try_files /static-content/tool.html =404; }

        # 改版 v8 (2026-06-21): H5 子域 sitemap/robots 走 Next.js,
        # 解决百度"索引型 sitemap"误判 (PC 用 root 文件, H5 用 Next.js 输出)
        location = /sitemap.xml {
            proxy_pass http://nextjs_local;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location = /robots.txt {
            proxy_pass http://nextjs_local;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location = /sitemap-baidu.xml { }
        location = /llms.txt     { }
        location = /googleca0c92e68f0ca67c.html { }
        location = /MP_verify_ZfvMTOA5IvTKBOHF.txt { }
        location = /favicon.ico  { access_log off; log_not_found off; }

        # 改版 v7 (2026-06-19): /wechat/bind 302 跳 h5 子域, 防 CTA 死循环
        #   - 症状: index.html 上的 "立即绑定" 按钮直接跳 h5 子域, 但用户从
        #            主站刷新后再次点按钮, 浏览器无感知
        #   - 修复: 大陆端先把 /wechat/bind 走 302 → h5 子域, 避免 JS 拦截器
        #            失效 (CSP / AdBlock / 慢加载) 导致用户多次点击循环
        location = /wechat/bind {
            return 302 https://h5.aiwill-planner.cn/wechat/bind;
        }

        # ===== B) Next.js 动态路由 - 反向代理到本地 127.0.0.1:3000 =====
        # 合规说明: upstream 是 127.0.0.1, 物理上未出大陆, 不违反禁止反代境外规则;
        #          Node 进程在大陆 CVM 内部, Supabase 自建在内网.
        location ^~ /admin {
            location = /admin { proxy_pass http://nextjs_local; }
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location /api/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /affiliate/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /affiliate {
            proxy_pass http://nextjs_local/affiliate;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # 改版 v6 (2026-06-09): /doc-type 文书类型选择器从静态页改为 next.js 动态 SSR
        #   - 原因: 用户旅程 /  →  /doc-type  →  /questionnaire
        #   - 静态 HTML 路径已废 (index.html 只放首页,其他走 next.js 渲染最新文案)
        #   - 与 /questionnaire 一致: 走本地 127.0.0.1:3000 next-server, 不出大陆
        location /doc-type {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /questionnaire {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /orders {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /guide {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /payment {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /result {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /account {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 改版 v6.2 (2026-06-10): 补 /dashboard 路由
        #   - 症状: 用户登录成功后 redirect('/dashboard') 撞兜底 404
        #   - 原因: /dashboard 是新增路由, 之前 v6 改版时漏配 nginx location
        #   - 修复: 与 /orders /payment 同样的 next.js 动态 SSR 走法
        #   - upstream 仍是 127.0.0.1:3000, 不出大陆
        location /dashboard {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 改版 v6.1 (2026-06-10): 补齐 5 个缺失动态路由
        #   - 症状: /login /register /about /privacy /terms 在 v6 改版时漏配 nginx location
        #           导致 hit 兜底 404 (用户点 footer 链接全坏)
        #   - 修复: 与 /questionnaire /account 同样的 next.js 动态 SSR 走法
        #   - upstream 仍是 127.0.0.1:3000, 不出大陆
        location /login {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /register {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /about {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /privacy {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /terms {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /wechat/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Next.js 静态资源
        location ^~ /_next/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }

        # ===== C) 健康检查 =====
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
        location = /healthz {
            access_log off;
            proxy_pass http://nextjs_local/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # ===== D) 静态资源缓存 =====
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ===== E) 合规死线: 兜底 404 =====
        location / {
            return 404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 '页面不存在 | <a href="/">返回首页</a>';
            add_header Content-Type text/html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }
}
