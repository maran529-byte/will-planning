apiVersion: apps/v1
kind: Deployment
metadata:
  name: t4-contract-generator
  namespace: aiwill-planner
  labels:
    app: t4-contract-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: t4-contract-generator
  template:
    metadata:
      labels:
        app: t4-contract-generator
    spec:
      containers:
        - name: contract-generator
          image: aiwill-planner/t4-contract-generator:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: t4-contract-generator-config
          volumeMounts:
            - name: templates
              mountPath: /templates
            - name: rules
              mountPath: /rules
            - name: logs
              mountPath: /logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: templates
          persistentVolumeClaim:
            claimName: t4-templates-pvc
        - name: rules
          configMap:
            name: t4-contract-rules
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t4-templates-pvc
  namespace: aiwill-planner
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: t4-contract-generator
  namespace: aiwill-planner
spec:
  selector:
    app: t4-contract-generator
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP