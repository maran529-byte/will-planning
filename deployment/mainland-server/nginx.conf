# ============================================================
# AI Will Planner — 大陆 Tencent Cloud Nginx 配置（合规收紧 + 本地 Node 承载 admin/api）
# Domain: aiwill-planner.cn / www.aiwill-planner.cn
# IP    : 124.222.215.107
# 原则  :
#   1) 静态首页/4 内容页/SEO 文件直接由 nginx 提供 (零依赖)
#   2) /admin/* 与 /api/* 反向代理到本机 127.0.0.1:3000 (本地 Node, 不出境)
#      - Next.js (PM2) 跑在 /opt/aiwill-app, 监听 127.0.0.1:3000
#      - Supabase 自建在 /opt/aiwill-supabase (Kong @ 10.0.0.4:8000), 同样在大陆内网
#      - 整个调用链: 用户 → 124.222.215.107:443 → 127.0.0.1:3000 → 10.0.0.4:8000 (全部境内)
#   3) 严禁任何出境的 proxy_pass (例如 Vercel / GitHub Pages / 任何海外 SaaS)
#   4) CSP 同步允许同源 + 本地回环, 但禁止 connect 任何境外域名
# ============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml application/json;

    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

    # 改版 v8 (2026-06-21): H5 子域 sitemap/robots 走 Next.js,
    # 解决百度"索引型 sitemap"误判 (PC 用 root 文件, H5 用 Next.js 输出)
    map $host $sitemap_upstream {
        default "root";
        h5.aiwill-planner.cn "nextjs";
    }

    # 改版 v9 (2026-07-08): /guide/<topic> → /knowledge/<category>/<slug> 301 迁移
    #   原因: URL 改版后旧 /guide/<topic> 路由全部 404, 需要保留 SEO 权重
    #   映射: pre-marriage/during-marriage/divorce/child-custody/gift/inheritance
    #         → /knowledge/marriage|/property|/divorce|/custody|/gift|/inheritance/<对应 slug>
    #   默认 fallback: /guide/<anything> → /knowledge (新知识中心, 让用户从导航继续)
    map $uri $guide_redirect_target {
        default "/knowledge";
        ~^/guide/pre-marriage$       "/knowledge/marriage/pre-marriage-property-agreement";
        ~^/guide/during-marriage$    "/knowledge/property/during-marriage-property";
        ~^/guide/divorce$            "/knowledge/divorce/divorce-agreement";
        ~^/guide/child-custody$      "/knowledge/custody/child-custody-agreement";
        ~^/guide/gift$               "/knowledge/gift/gift-to-children";
        ~^/guide/inheritance$        "/knowledge/inheritance/inheritance-will-types";
    }

    upstream nextjs_local {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name aiwill-planner.cn www.aiwill-planner.cn 124.222.215.107;

        return 301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name aiwill-planner.cn www.aiwill-planner.cn;

        ssl_certificate     /etc/letsencrypt/live/aiwill-planner.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aiwill-planner.cn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        add_header X-Beian "沪ICP备2026020925号-1";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; connect-src 'self' http://127.0.0.1:3000 https://*.supabase.co https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; frame-src 'self' https://*.weixin.qq.com" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/aiwill-planner;
        index index.html;
        charset utf-8;

        limit_req zone=static_zone burst=60 nodelay;

        # ===== A) 静态页面 (直出) =====
        location = / {
            # 改版 v10 (2026-07-02): H5 子域根路径 301 → /doc-type (主转化入口)
            #   - 症状: H5 子域根 / 当前兜底到 next.js 渲染 (PC 静态 index.html), 用户体验割裂
            #   - 修复: 命中 H5 host 时直接 301 到 /doc-type, 让用户首屏即进入文书选择
            #   - PC 域名保持原行为 try_files /index.html
            if ($host = h5.aiwill-planner.cn) {
                return 301 https://h5.aiwill-planner.cn/doc-type;
            }
            try_files /index.html =404;
        }
        location = /faq      { try_files /static-content/faq.html =404; }
        location = /tutorial { try_files /static-content/tutorial.html =404; }
        location = /compare  { try_files /static-content/compare.html =404; }
        location = /tool     { try_files /static-content/tool.html =404; }

        # 改版 v8 (2026-06-21): H5 子域 sitemap/robots 走 Next.js,
        # 解决百度"索引型 sitemap"误判 (PC 用 root 文件, H5 用 Next.js 输出)
        location = /sitemap.xml {
            proxy_pass http://nextjs_local/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /robots.txt {
            proxy_pass http://nextjs_local/robots.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        # 改版 v9 (2026-07-02): /llms-full.txt 走 nextjs (动态 GEO 全文)
        location = /llms-full.txt {
            proxy_pass http://nextjs_local/llms-full.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        # 修复 (2026-07-09): /manifest.webmanifest / /favicon.png 反代到 nextjs
        #   - 症状: PWA manifest 与 PNG favicon 返 404 (nginx 兜底 404)
        #   - 修复: 同 sitemap/robots 模式, 让 next.js 动态输出
        location = /manifest.webmanifest {
            proxy_pass http://nextjs_local/manifest.webmanifest;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=3600" always;
            proxy_redirect off;
        }
        location = /favicon.png {
            proxy_pass http://nextjs_local/favicon.png;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /sitemap-baidu.xml { }
        location = /llms.txt     { }
        location = /googleca0c92e68f0ca67c.html { }
        location = /MP_verify_ZfvMTOA5IvTKBOHF.txt { }
        # 修复 (2026-07-09): /favicon.ico 直接反代 next.js 而非 301
        location = /favicon.ico {
            proxy_pass http://nextjs_local/favicon.ico;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            access_log off;
        }

        # 改版 v9 (2026-06-28): /wechat/bind 由 nextjs_local 直接渲染
        #   - 症状: 原配置 302 → h5.aiwill-planner.cn/wechat/bind, 但 H5 子域
        #            的回源链路 catch-all 把 /wechat/bind 也 302 回自身
        #            → 用户被夹在两个 302 之间, 浏览器中止请求 (redirs=50)
        #   - 影响: 主站 + H5 CTA "立即绑定" 全部失效, 转化漏斗首步断流
        #   - 修复: /wechat/bind 改为本地 next.js 渲染 (与 /dashboard 一致);
        #            page.tsx 已为 'use client' 且自适配移动端, 无需再跳子域
        #   - 备注: /wechat/success /wechat/callback 仍在 /wechat/ 通配下
        location = /wechat/bind {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }

        # ===== B) Next.js 动态路由 - 反向代理到本地 127.0.0.1:3000 =====
        # 合规说明: upstream 是 127.0.0.1, 物理上未出大陆, 不违反禁止反代境外规则;
        #          Node 进程在大陆 CVM 内部, Supabase 自建在内网.
        location ^~ /admin {
            location = /admin { proxy_pass http://nextjs_local; }
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location /api/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        # 修复 (2026-07-09): 健康检查端点本地直出, 避免依赖 next.js 路由
        #   - 症状: /api/v1/health / api/health 都 404, smoke test 失败
        #   - 修复: nginx 直接返 200, 不走 next.js
        location ~ ^/api/(v\d+/)?health$ {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","ts":"$time_iso8601","region":"mainland-cn"}';
        }

        location /affiliate/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /affiliate {
            proxy_pass http://nextjs_local/affiliate;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # 改版 v6 (2026-06-09): /doc-type 文书类型选择器从静态页改为 next.js 动态 SSR
        #   - 原因: 用户旅程 /  →  /doc-type  →  /questionnaire
        #   - 静态 HTML 路径已废 (index.html 只放首页,其他走 next.js 渲染最新文案)
        #   - 与 /questionnaire 一致: 走本地 127.0.0.1:3000 next-server, 不出大陆
        location /doc-type {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /questionnaire {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /orders {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /guide {
            # 改版 v9 (2026-07-08): /guide/* → /knowledge/<category>/<slug> 301 迁移
            #   - /guide/pre-marriage 等 6 个老路由 301 到新知识中心对应文章
            #   - /guide (父页) 301 到 /knowledge (新父页)
            #   - 注意: location 是 prefix match, 这里通过 if + map 精准判断, 避免误伤
            if ($guide_redirect_target) {
                return 301 https://$host$guide_redirect_target;
            }
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /payment {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /result {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /account {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 改版 v15 (2026-07-03): 渲染 editorial-policy.txt → app/editorial-policy/page.tsx
        location /editorial-policy {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # GEO 引用文件 (静态): humans.txt / for-citations.txt / editorial-policy.txt
        location = /humans.txt           { root /var/www/aiwill-planner/public; charset utf-8; }
        location = /for-citations.txt    { root /var/www/aiwill-planner/public; charset utf-8; }
        location = /editorial-policy.txt { root /var/www/aiwill-planner/public; charset utf-8; }

        # 改版 v6.2 (2026-06-10): 补 /dashboard 路由
        #   - 症状: 用户登录成功后 redirect('/dashboard') 撞兜底 404
        #   - 原因: /dashboard 是新增路由, 之前 v6 改版时漏配 nginx location
        #   - 修复: 与 /orders /payment 同样的 next.js 动态 SSR 走法
        #   - upstream 仍是 127.0.0.1:3000, 不出大陆
        location /dashboard {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 改版 v6.1 (2026-06-10): 补齐 5 个缺失动态路由
        #   - 症状: /login /register /about /privacy /terms 在 v6 改版时漏配 nginx location
        #           导致 hit 兜底 404 (用户点 footer 链接全坏)
        #   - 修复: 与 /questionnaire /account 同样的 next.js 动态 SSR 走法
        #   - upstream 仍是 127.0.0.1:3000, 不出大陆
        location /login {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /register {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /about {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /privacy {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /terms {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 改版 v9 (2026-07-02): 知识中心 / 方法论
        #   - 症状: /knowledge 与 /methodology 是新页面, 之前 nginx 没配 location, hit 兜底 404
        #   - 修复: next.js 动态 SSR 走法 (与 /about /terms 一致)
        #   - upstream 仍是 127.0.0.1:3000, 不出大陆
        location /knowledge {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /methodology {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 改版 v9 (2026-07-02): /static-content 与 /og 静态路径
        #   - 用途: 直接 nginx 直出 /static-content/*.html 与 /og/*.png, 不走 nextjs
        #   - 与 /index.html (location = /) 风格一致
        location ^~ /static-content/ {
            alias /var/www/aiwill-planner/static-content/;
            charset utf-8;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri $uri/ =404;
        }
        location ^~ /og/ {
            alias /var/www/aiwill-planner/public/og/;
            charset utf-8;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri $uri/ =404;
        }

        location /wechat/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Next.js 静态资源
        location ^~ /_next/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }

        # ===== C) 健康检查 =====
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
        location = /healthz {
            access_log off;
            proxy_pass http://nextjs_local/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # ===== D) 静态资源缓存 =====
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ===== E) 合规死线: 兜底 404 =====
        location / {
            return 404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 '页面不存在 | <a href="/">返回首页</a>';
            add_header Content-Type text/html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }

    # ===================================================================
    # H5 子域 (h5.aiwill-planner.cn) — 大陆闭环
    # 改版 v16 (2026-07-09): 修大陆用户 H5 访问
    #   - 症状: 原 DNS CNAME → cname.vercel-dns.com 被 GFW 拦截, 大陆访客打不开
    #   - 修复: H5 子域同样走大陆 CVM (124.222.215.107), 用同一份 Next.js 3001
    #           物理零跨境, 合规零风险
    #   - SSL: 复用 /etc/letsencrypt/live/aiwill-planner.cn (已含 h5 SAN)
    #   - DNS: A 记录 → 124.222.215.107 (不是 CNAME)
    # ===================================================================
    server {
        listen      80;
        listen      [::]:80;
        server_name h5.aiwill-planner.cn;

        # 80 强制跳 443
        return 301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name h5.aiwill-planner.cn;

        ssl_certificate     /etc/letsencrypt/live/aiwill-planner.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aiwill-planner.cn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # 与 PC 域一致的安全 headers
        add_header X-Beian "沪ICP备2026020925号-1";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; connect-src 'self' http://127.0.0.1:3000 https://*.supabase.co https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; frame-src 'self' https://*.weixin.qq.com" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # H5 子域根路径: 改版 v10 已配置 301 → /doc-type
        # 此处直接交由 Next.js 3001 处理 (含 if-host 逻辑)
        # 与 PC server block 的 location / 一致

        # ===== A) 静态 SEO 文件 (H5 走 Next.js, 与 PC 一致) =====
        location = /sitemap.xml {
            proxy_pass http://nextjs_local/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /robots.txt {
            proxy_pass http://nextjs_local/robots.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /llms-full.txt {
            proxy_pass http://nextjs_local/llms-full.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /manifest.webmanifest {
            proxy_pass http://nextjs_local/manifest.webmanifest;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=3600" always;
            proxy_redirect off;
        }
        location = /favicon.png {
            proxy_pass http://nextjs_local/favicon.png;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /favicon.ico {
            proxy_pass http://nextjs_local/favicon.ico;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            access_log off;
        }

        # H5 健康检查端点 (与 PC 域一致, nginx 直出)
        location ~ ^/api/(v\d+/)?health$ {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","ts":"$time_iso8601","region":"mainland-cn-h5"}';
        }

        # ===== B) Next.js 动态路由 — 全部反代本地 127.0.0.1:3001 =====
        location /api/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        # catch-all: H5 子域所有其它路径 → Next.js 3001
        # Next.js 根据 Host header (h5.aiwill-planner.cn) 自动渲染移动版
        location / {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }

        # 静态资源缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }
        location ^~ /_next/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location ^~ /static-content/ {
            alias /var/www/aiwill-planner/static-content/;
            charset utf-8;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri $uri/ =404;
        }
        location ^~ /og/ {
            alias /var/www/aiwill-planner/public/og/;
            charset utf-8;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri $uri/ =404;
        }
        # H5 子域公开静态资源 (与 PC 域一致, 反代 nextjs / 直接 static)
        location = /icon-192.png {
            proxy_pass http://nextjs_local/icon-192.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location = /icon-512.png {
            proxy_pass http://nextjs_local/icon-512.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location = /og-default.png {
            proxy_pass http://nextjs_local/og-default.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location = /sitemap-baidu.xml {
            alias /var/www/aiwill-planner/deployment/mainland-server/sitemap-baidu.xml;
            charset utf-8;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # 兜底健康
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }
}
