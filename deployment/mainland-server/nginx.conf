        }

        # 改版 v28 (2026-07-30): /supabase/* 反代 — 给 HK H5 调用 mainland Supabase
        #   - 用途: HK 服务器 (43.129.207.154) 通过 Cloudflare 代理 + /supabase/* 路径访问 Kong
        #   - 安全: Kong 已用 anon_key / service_role_key JWT 鉴权, 不另加白名单
        #   - 注意: 此路径仅在 Cloudflare 代理下生效 (DNS-only 模式直接 8000 被 GFW 屏蔽)
        #   - CSP: 已在 v26 CSP 中允许 https://*.supabase.co (但本路径是 aiwill-planner.cn/supabase,
        #          同源连接, 不需要额外 CSP 调整)
        #   - 限流: api_zone 限速避免被滥用
        location ^~ /supabase/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
            # 关键: 去掉 /supabase/ 前缀, 让 Kong 看到标准 REST 路径
            # 已在 proxy_pass http://127.0.0.1:8000/ 末尾加 / 实现自动剥离
        }

        # 改版 v27 (2026-07-30): 新增 /wallet-policy /overseas 路由
        #   - 症状: 健康检查发现这 2 个路由 404
        #   - 原因: src/app/{wallet-policy,overseas}/page.tsx 存在, 但 nginx 没配 location, 兜底 404
        #   - 修复: 反代 nextjs_local, 让 next.js 动态 SSR 渲染
        location /wallet-policy {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /overseas {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 改版 v9 (2026-07-02): /static-content 与 /og 静态路径
        #   - 用途: 直接 nginx 直出 /static-content/*.html 与 /og/*.png, 不走 nextjs
        #   - 与 /index.html (location = /) 风格一致
        location ^~ /static-content/ {
            alias /var/www/aiwill-planner/static-content/;
            charset utf-8;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri $uri/ =404;
        }
        location ^~ /og/ {
            alias /var/www/aiwill-planner/public/og/;
            charset utf-8;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri $uri/ =404;
        }

        location /wechat/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Next.js 静态资源
        location ^~ /_next/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }

        # ===== C) 健康检查 =====
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
        location = /healthz {
            access_log off;
            proxy_pass http://nextjs_local/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # ===== D) 静态资源缓存 =====
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ===== E) 合规死线: 兜底 404 =====
        # 改版 v26 (2026-07-24): 移动 UA 兜底 302 → H5
        #   - 行为: PC 域上未匹配任何 location 的请求, 若 UA 是移动设备, 302 到 H5
        #   - 已知 location (首页/doc-type/订单等) 已在具体 location 内判断
        #   - 此处兜底处理: 用户从微信扫码 / 短信链接 / 收藏夹打开未知 PC 路径
        location / {
            if ($is_mobile_ua = 1) {
                return 302 https://h5.aiwill-planner.cn$request_uri;
            }
            return 404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 '页面不存在 | <a href="/">返回首页</a>';
            add_header Content-Type text/html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }

    # ===================================================================
    # H5 子域 (h5.aiwill-planner.cn) — 大陆闭环
    # 改版 v16 (2026-07-09): 修大陆用户 H5 访问
    #   - 症状: 原 DNS CNAME → cname.vercel-dns.com 被 GFW 拦截, 大陆访客打不开
    #   - 修复: H5 子域同样走大陆 CVM (124.222.215.107), 用同一份 Next.js 3001
    #           物理零跨境, 合规零风险
    #   - SSL: 复用 /etc/letsencrypt/live/aiwill-planner.cn (已含 h5 SAN)
    #   - DNS: A 记录 → 124.222.215.107 (不是 CNAME)
    # ===================================================================
    server {
        listen      80;
        listen      [::]:80;
        server_name h5.aiwill-planner.cn;

        # 80 强制跳 443
        return 301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name h5.aiwill-planner.cn;

        ssl_certificate     /etc/letsencrypt/live/aiwill-planner.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aiwill-planner.cn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # 改版 v17 (2026-07-09): H5 域根 UA 自适应
        # - 桌面 UA (Windows/Mac/Linux + 现代浏览器) → 跳主站 https://aiwill-planner.cn
        # - 移动 UA + 平板 + 微信内 → 正常渲染 H5
        # - 爬虫/SEO 爬虫 (Googlebot/Baiduspider) → 跳主站, 避免 H5 重复索引
        # 注意: Mobile UA 包含 Safari/604.1, 不能简单用 Safari 数字判定桌面
        set $desktop_ua 0;
        if ($http_user_agent ~* "Windows NT|Macintosh|X11|Linux x86_64") { set $desktop_ua 1; }
        if ($http_user_agent ~* "Edg/[0-9]|Chrome/[6-9][0-9]|Firefox/[7-9][0-9]") { set $desktop_ua 1; }
        if ($http_user_agent ~* "Googlebot|bingbot|Baiduspider|YandexBot|DuckDuckBot") { set $desktop_ua 1; }

        # 与 PC 域一致的安全 headers
        add_header X-Beian "沪ICP备2026020925号-1; 沪公网安备31011502406720号";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; connect-src 'self' http://127.0.0.1:3000 https://*.supabase.co https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; frame-src 'self' https://*.weixin.qq.com" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # H5 子域根路径: 改版 v10 已配置 301 → /doc-type
        # 此处直接交由 Next.js 3001 处理 (含 if-host 逻辑)
        # 与 PC server block 的 location / 一致

        # ===== A) 静态 SEO 文件 (H5 走 Next.js, 与 PC 一致) =====
        location = /sitemap.xml {
            proxy_pass http://nextjs_local/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /robots.txt {
            proxy_pass http://nextjs_local/robots.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /llms-full.txt {
            proxy_pass http://nextjs_local/llms-full.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /manifest.webmanifest {
            proxy_pass http://nextjs_local/manifest.webmanifest;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=3600" always;
            proxy_redirect off;
        }
        location = /favicon.png {
            proxy_pass http://nextjs_local/favicon.png;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /favicon.ico {
            proxy_pass http://nextjs_local/favicon.ico;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            access_log off;
        }

        # H5 健康检查端点 (与 PC 域一致, nginx 直出)
        location ~ ^/api/(v\d+/)?health$ {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","ts":"$time_iso8601","region":"mainland-cn-h5"}';
        }

        # ===== B) Next.js 动态路由 — 全部反代本地 127.0.0.1:3001 =====
        location /api/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        # catch-all: H5 子域所有其它路径 → Next.js 3001
        # 改版 v18 (2026-07-10): 桌面 UA 整站跳主站 (含子路径)
        #   - 症状: 桌面 UA 访问 h5.aiwill-planner.cn/doc-type 不重定向, 渲染移动端布局到桌面浏览器
        #   - 修复: 所有未匹配 location 都先做 UA 判断, 桌面 UA 统一 302 到主站
        location / {
            if ($desktop_ua = 1) {
                return 302 https://aiwill-planner.cn$request_uri;
            }
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }
        # 改版 v23 (2026-07-19): H5 同样支持 GEO 文章
        location /articles/ {
            if ($desktop_ua = 1) {
                return 302 https://aiwill-planner.cn$request_uri;
            }
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # 静态资源缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }
        location ^~ /_next/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location ^~ /static-content/ {
            alias /var/www/aiwill-planner/static-content/;
            charset utf-8;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri $uri/ =404;
        }
        location ^~ /og/ {
            alias /var/www/aiwill-planner/public/og/;
            charset utf-8;
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri $uri/ =404;
        }
        # H5 子域公开静态资源 (与 PC 域一致, 反代 nextjs / 直接 static)
        location = /icon-192.png {
            proxy_pass http://nextjs_local/icon-192.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location = /icon-512.png {
            proxy_pass http://nextjs_local/icon-512.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location = /og-default.png {
            proxy_pass http://nextjs_local/og-default.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }
        location = /sitemap-baidu.xml {
            alias /var/www/aiwill-planner/deployment/mainland-server/sitemap-baidu.xml;
            charset utf-8;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # 兜底健康
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }
}

