# ============================================================
# AI Will Planner — 大陆 Tencent Cloud Nginx 配置（合规收紧 + 本地 Node 承载 admin/api）
# Domain: aiwill-planner.cn / www.aiwill-planner.cn
# IP    : 124.222.215.107
# 原则  :
#   1) 静态首页/4 内容页/SEO 文件直接由 nginx 提供 (零依赖)
#   2) /admin/* 与 /api/* 反向代理到本机 127.0.0.1:3000 (本地 Node, 不出境)
#      - Next.js (PM2) 跑在 /opt/aiwill-app, 监听 127.0.0.1:3000
#      - Supabase 自建在 /opt/aiwill-supabase (Kong @ 10.0.0.4:8000), 同样在大陆内网
#      - 整个调用链: 用户 → 124.222.215.107:443 → 127.0.0.1:3000 → 10.0.0.4:8000 (全部境内)
#   3) 严禁任何出境的 proxy_pass (例如 Vercel / GitHub Pages / 任何海外 SaaS)
#   4) CSP 同步允许同源 + 本地回环, 但禁止 connect 任何境外域名
# ============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml application/json;

    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

    upstream nextjs_local {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name aiwill-planner.cn www.aiwill-planner.cn 124.222.215.107;

        return 301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name aiwill-planner.cn www.aiwill-planner.cn;

        ssl_certificate     /etc/letsencrypt/live/aiwill-planner.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aiwill-planner.cn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        add_header X-Beian "沪ICP备2026020925号-1" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://127.0.0.1:3000; frame-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/aiwill-planner;
        index index.html;
        charset utf-8;

        limit_req zone=static_zone burst=60 nodelay;

        # ===== A) 静态页面 (直出) =====
        location = / { try_files /index.html =404; }
        location = /faq      { try_files /static-content/faq.html =404; }
        location = /tutorial { try_files /static-content/tutorial.html =404; }
        location = /compare  { try_files /static-content/compare.html =404; }
        location = /tool     { try_files /static-content/tool.html =404; }

        location = /robots.txt   { }
        location = /sitemap.xml  { }
        location = /favicon.ico  { access_log off; log_not_found off; }

        # ===== B) Next.js 动态路由 - 反向代理到本地 127.0.0.1:3000 =====
        # 合规说明: upstream 是 127.0.0.1, 物理上未出大陆, 不违反禁止反代境外规则;
        #          Node 进程在大陆 CVM 内部, Supabase 自建在内网.
        location ^~ /admin {
            location = /admin { proxy_pass http://nextjs_local; }
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location /api/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /affiliate/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /affiliate {
            proxy_pass http://nextjs_local/affiliate;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /questionnaire {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /orders {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /payment {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /result {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /account {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location /wechat/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Next.js 静态资源
        location ^~ /_next/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            expires 30d;
            access_log off;
        }

        # ===== C) 健康检查 =====
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
        location = /healthz {
            access_log off;
            proxy_pass http://nextjs_local/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # ===== D) 静态资源缓存 =====
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ===== E) 合规死线: 兜底 404 =====
        location / {
            return 404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 '页面不存在 | <a href="/">返回首页</a>';
            add_header Content-Type text/html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }
}
