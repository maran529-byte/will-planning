# ============================================================
# AI Will Planner — 大陆 Tencent Cloud Nginx 配置（合规收紧版）
# Domain: aiwill-planner.cn / www.aiwill-planner.cn
# IP    : 124.222.215.107
# 原则  ：本节点仅提供 5 个静态页面，绝不反向代理任何境外端点
#         所有动态/AI 能力只能通过 h5.aiwill-planner.cn → 43.129.207.154
# ============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml;

    # 限流（防爬虫）
    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=30r/s;

    # ============================================================
    # HTTP（80）—— 强制跳转到 HTTPS；H5/API 仍 301 到 h5 子域
    # ============================================================
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name aiwill-planner.cn www.aiwill-planner.cn 124.222.215.107;

        # 整站 301 跳到 HTTPS（保留路径+query）
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # HTTPS（443）—— Let's Encrypt 证书 + 与 80 等价的 location
    # cert 路径: /etc/letsencrypt/live/aiwill-planner.cn/
    # 续期: certbot renew --quiet (systemd timer 每月自动跑)
    # ============================================================
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name aiwill-planner.cn www.aiwill-planner.cn;

        ssl_certificate     /etc/letsencrypt/live/aiwill-planner.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aiwill-planner.cn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # 网信办备案头（部分地区合规要求显式标识）
        add_header X-Beian "沪ICP备2026020925号-1" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://aiwill-planner.vercel.app" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/aiwill-planner;
        index index.html;
        charset utf-8;

        limit_req zone=static_zone burst=60 nodelay;

        # ----- 1. 首页: / -> index.html -----
        # 注意: try_files 用以 / 开头的绝对路径,不依赖 alias 解析
        #       (旧版用 alias + try_files $uri.html 在 nginx 1.24 上
        #        实际解析为 /var/www/aiwill-planner/faq.html, 404)
        location = / { try_files /index.html =404; }

        # ----- 2-5. 四个内容页: 绝对路径 try_files, 走 server-level root -----
        location = /faq      { try_files /static-content/faq.html =404; }
        location = /tutorial { try_files /static-content/tutorial.html =404; }
        location = /compare  { try_files /static-content/compare.html =404; }
        location = /tool     { try_files /static-content/tool.html =404; }

        # ----- SEO/收录 -----
        location = /robots.txt   { }
        location = /sitemap.xml  { }
        location = /favicon.ico  { access_log off; log_not_found off; }

        # ----- 动态页面 301 引导到 h5 子域 -----
        # 原因: CN 节点按合规要求仅承载 5 个静态页, 所有需要后端/Supabase 的动态页
        #       (后台登录、博主申请、工作台、问卷、订单、支付、结果页、账户、回调)
        #       都通过 h5 子域 (Vercel) 提供. 用 301 避免用户收藏 404 链接.
        # 顺序: 必须放在 `location / { return 404; }` 之前, 否则会被吞.
        location /admin/      { return 301 https://h5.aiwill-planner.cn$request_uri; }
        location /affiliate/  { return 301 https://h5.aiwill-planner.cn$request_uri; }
        location = /affiliate { return 301 https://h5.aiwill-planner.cn/affiliate; }
        location /questionnaire { return 301 https://h5.aiwill-planner.cn$request_uri; }
        location /orders/     { return 301 https://h5.aiwill-planner.cn$request_uri; }
        location = /orders    { return 301 https://h5.aiwill-planner.cn/orders; }
        location /payment     { return 301 https://h5.aiwill-planner.cn$request_uri; }
        location /result      { return 301 https://h5.aiwill-planner.cn$request_uri; }
        location /account     { return 301 https://h5.aiwill-planner.cn$request_uri; }
        location /wechat/     { return 301 https://h5.aiwill-planner.cn$request_uri; }

        # ----- 健康检查（运维用） -----
        location = /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }

        # ----- 静态资源（图片/CSS）-----
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ============================================================
        # ❌ 合规死线：禁止任何 proxy_pass，禁止 / 与 /api/* 反代境外
        # 任何其他路径一律返回 404，不暴露端点
        # ============================================================
        location / {
            return 404;
        }

        location /api/ {
            # 大陆节点不再承接 API，统一引导到 h5 子域
            return 301 https://h5.aiwill-planner.cn$request_uri;
        }

        # 错误页
        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 '页面不存在 | <a href="/">返回首页</a>';
            add_header Content-Type text/html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            return 500 '服务暂时不可用';
            add_header Content-Type text/plain;
        }
    }
}
