        location /guide {
            # 改版 v9 (2026-07-08): /guide/* → /knowledge/<category>/<slug> 301 迁移
            #   - /guide/pre-marriage 等 6 个老路由 301 到新知识中心对应文章
            #   - /guide (父页) 301 到 /knowledge (新父页)
            #   - 注意: location 是 prefix match, 这里通过 if + map 精准判断, 避免误伤
            if ($guide_redirect_target) {
