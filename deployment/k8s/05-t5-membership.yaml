apiVersion: apps/v1
kind: Deployment
metadata:
  name: t5-membership
  namespace: aiwill-planner
  labels:
    app: t5-membership
spec:
  replicas: 2
  selector:
    matchLabels:
      app: t5-membership
  template:
    metadata:
      labels:
        app: t5-membership
    spec:
      containers:
        - name: membership
          image: aiwill-planner/t5-membership:latest
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: aiwill-secrets
                  key: membership-db-dsn
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: aiwill-secrets
                  key: stripe-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aiwill-secrets
                  key: jwt-secret
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: t5-membership
  namespace: aiwill-planner
spec:
  selector:
    app: t5-membership
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP