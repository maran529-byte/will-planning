id: contract-amount-limit
name: Contract Amount Limit
description: Reject contracts with amount exceeding maximum limit
category: financial
version: "1.0"
priority: 10
enabled: true
conditions:
  - field: contract_amount
    operator: gt
    value: 1000000
actions:
  - type: reject
    params:
      reason: "Contract amount exceeds maximum limit of 1,000,000"