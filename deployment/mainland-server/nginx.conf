        # 改版 v23 (2026-07-19): GEO 文章静态托管 (/articles/*)
        #   - 症状: /articles/cross-border/cb01.html 等静态文章返 404
        #   - 原因: catch-all location / { return 404 } 拦截, 未配 nextjs 反代
        #   - 修复: 反代 nextjs (内部已有 [...slug] route.ts + public/articles/ 静态兜底)
        location /articles/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
