# ============================================================
# AI Will Planner — 大陆 Tencent Cloud Nginx 配置（合规收紧 + 本地 Node 承载 admin/api）
# Domain: aiwill-planner.cn / www.aiwill-planner.cn
# IP    : 124.222.215.107
# 原则  :
#   1) 静态首页/4 内容页/SEO 文件直接由 nginx 提供 (零依赖)
#   2) /admin/* 与 /api/* 反向代理到本机 127.0.0.1:3000 (本地 Node, 不出境)
#      - Next.js (PM2) 跑在 /opt/aiwill-app, 监听 127.0.0.1:3000
#      - Supabase 自建在 /opt/aiwill-supabase (Kong @ 10.0.0.4:8000), 同样在大陆内网
#      - 整个调用链: 用户 → 124.222.215.107:443 → 127.0.0.1:3000 → 10.0.0.4:8000 (全部境内)
#   3) 严禁任何出境的 proxy_pass (例如 Vercel / GitHub Pages / 任何海外 SaaS)
#   4) CSP 同步允许同源 + 本地回环, 但禁止 connect 任何境外域名
# ============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml application/json;

    limit_req_zone $binary_remote_addr zone=static_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

    # 改版 v8 (2026-06-21): H5 子域 sitemap/robots 走 Next.js,
    # 解决百度"索引型 sitemap"误判 (PC 用 root 文件, H5 用 Next.js 输出)
    map $host $sitemap_upstream {
        default "root";
        h5.aiwill-planner.cn "nextjs";
    }

    # 改版 v9 (2026-07-08): /guide/<topic> → /knowledge/<category>/<slug> 301 迁移
    #   原因: URL 改版后旧 /guide/<topic> 路由全部 404, 需要保留 SEO 权重
    #   映射: pre-marriage/during-marriage/divorce/child-custody/gift/inheritance
    #         → /knowledge/marriage|/property|/divorce|/custody|/gift|/inheritance/<对应 slug>
    #   默认 fallback: /guide/<anything> → /knowledge (新知识中心, 让用户从导航继续)
    map $uri $guide_redirect_target {
        default "/knowledge";
        ~^/guide/pre-marriage$       "/knowledge/marriage/pre-marriage-property-agreement";
        ~^/guide/during-marriage$    "/knowledge/property/during-marriage-property";
        ~^/guide/divorce$            "/knowledge/divorce/divorce-agreement";
        ~^/guide/child-custody$      "/knowledge/custody/child-custody-agreement";
        ~^/guide/gift$               "/knowledge/gift/gift-to-children";
        ~^/guide/inheritance$        "/knowledge/inheritance/inheritance-will-types";
    }

    upstream nextjs_local {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name aiwill-planner.cn www.aiwill-planner.cn 124.222.215.107;

        return 301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name aiwill-planner.cn www.aiwill-planner.cn;

        ssl_certificate     /etc/letsencrypt/live/aiwill-planner.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aiwill-planner.cn/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        add_header X-Beian "沪ICP备2026020925号-1; 沪公网安备31011502406720号";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; connect-src 'self' http://127.0.0.1:3000 https://*.supabase.co https://*.googletagmanager.com https://www.google-analytics.com https://hm.baidu.com; frame-src 'self' https://*.weixin.qq.com" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/aiwill-planner;
        index index.html;
        charset utf-8;

        limit_req zone=static_zone burst=60 nodelay;

        # 改版 v26 (2026-07-24): 手机端访问自动跳 H5 子域
        #   - 原因: 业务铁律 v1.0: "增加手机端访问网站"
        #   - 行为: PC 域收到移动 UA (iPhone/Android/iPad/微信内) → 302 → h5.aiwill-planner.cn
        #   - 例外: 爬虫 (Googlebot/Baiduspider) 保持 PC 内容供 SEO 索引
        #   - 配合 H5 域根 UA 跳转: 桌面 UA 访问 H5 → 302 → PC (v17 已实现)
        #   - 形成双向适配, 用户体验在两端都最优
        set $is_mobile_ua 0;
        if ($http_user_agent ~* "iPhone|iPod|Android|Mobile.*Safari|iPad|MicroMessenger|webOS|BlackBerry|Windows Phone|MQQBrowser|MiuiBrowser|UCBrowser|HarmonyOS") {
            set $is_mobile_ua 1;
        }
        # 排除 SEO 爬虫: 它们需要 PC 域内容, 不能被跳走
        if ($http_user_agent ~* "Googlebot|bingbot|Baiduspider|YandexBot|DuckDuckBot|Sogou|360Spider") {
            set $is_mobile_ua 0;
        }

        # ===== A) 静态页面 (直出) =====
        # 改版 v26.1 (2026-07-24): / 改走 Next.js, 移动 UA 直接 302 H5
        #   - 原因: 业务铁律 v1.0: 增加手机端访问, 移动 UA 看到主站必须是跳转卡 (而不是 PC 版 home)
        #   - 修复: 移动 UA 命中时直接 302 → H5 (避免主站首页 form/弹窗干扰)
        location = / {
            if ($is_mobile_ua = 1) {
                return 302 https://h5.aiwill-planner.cn$request_uri;
            }
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }
        # 改版 v25 (2026-07-23): /tool 改走 Next.js
        #   - 原因: 静态 tool.html 含 emailLoginForm (合规违规)
        #   - 修复: 反代 nextjs_local, host-aware /tool page.tsx 渲染
        location = /tool {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }
        # 改版 v25 (2026-07-23): /faq /tutorial /compare 改走 Next.js
        #   - 原因: 静态 html 含 emailLoginForm + pcCodeBox (合规违规)
        #   - 修复: 反代 nextjs_local (这些路径下若有动态路由则渲染, 无则 next.js 404)
        location = /faq {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }
        location = /tutorial {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }
        location = /compare {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }

        # ===== A.5) 合规拦截: PC 域禁止的 API 路径 (改版 v30, 2026-08-04) =====
        #   - 硬约束 (AGENTS.md v15): 主站 0 form 0 input 0 /api/* 调用
        #   - 旧 v25: 仅拦 /api/auth/ /api/feedback/ /api/wechat/pc-login-* /admin /menu
        #     漏: /api/orders /api/payment /api/generate-* /api/affiliate /api/red-packet
        #          /api/custom-inquiry /api/contact /api/book-lawyer /api/wallet 等业务 API
        #     这些 API 在 PC 域 200 暴露真实业务数据, 违反架构要求
        #   - 新 v30: 5 个 whitelist (^~ /api/ 前缀, 最长匹配优先) +
        #             1 个 blacklist 兜底 (普通前缀 /api/, longest match 兜底)
        #   - 顺序: nginx longest prefix match — /api/wechat/ 比 /api/ 长, 自动选 whitelist
        #   - 后续新增业务 API → 自动归入黑名单, 开发者无需改 nginx
        #   - 安全: 5 个 whitelist 都是已知白名单, 不会因新 API 误伤
        # ----------------------------------------------------------------------
        # 1) Whitelist: 已知安全的 API 子路径 (必须 ^~ 锁定, 优先匹配)
        #    - /api/admin/* 后台鉴权
        location ^~ /api/admin/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
        #    - /api/wechat/* 公众号回调 (mp-callback / oauth-callback / prepare-oauth / send-cs-msg / health)
        location ^~ /api/wechat/ {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
        #    - /api/payment/callback + /api/payment/hupijiao-callback 虎皮椒服务器回调
        location ^~ /api/payment/callback {
            access_log off;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location ^~ /api/payment/hupijiao-callback {
            access_log off;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        #    - /api/articles/* GEO 静态文章 (公开 API, 供给知识中心)
        location ^~ /api/articles/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        #    - /api/ab/* A/B 测试内部端点 (ab-testing.ts 自调, 不暴露敏感)
        location ^~ /api/ab/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        # 2) Blacklist 兜底: 全部 /api/ 默认 404 (合规)
        #    - 普通前缀 (不带 ^~), 让 longest match 选中上面 whitelist
        #    - 任何 /api/<业务> 请求 (orders / payment / generate-* / affiliate / red-packet
        #      / custom-inquiry / contact / book-lawyer / wallet / account / doc / dev /
        #      contracts / compliance / create-order / order / auth / feedback 等) → 404
        location /api/ {
            access_log off;
            return 404 '{"error":"not_found","reason":"mainland_pc_disabled"}';
            add_header Content-Type application/json;
        }

        # 改版 v25 (2026-07-23): /feedback 改走 Next.js
        #   - 原因: 原路径下 next.js 没有显式 location, hit 兜底 404
        #   - 修复: 反代 nextjs_local, host-aware /feedback page.tsx 渲染
        location = /feedback {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }

        # 改版 v8 (2026-06-21): H5 子域 sitemap/robots 走 Next.js,
        # 解决百度"索引型 sitemap"误判 (PC 用 root 文件, H5 用 Next.js 输出)
        location = /sitemap.xml {
            # 改版 v21 (2026-07-10): 改 alias 静态文件, 避免 Next.js 动态生成 lastmod 走样
            alias /var/www/aiwill-planner/sitemap.xml;
            default_type application/xml;
        }
        # 改版 v34 (2026-09-01): PC 域补 /api/health 直通 nextjs
        #   - 背景: aiwill-keeper 探针 https://aiwill-planner.cn/api/health 持续 404
        #   - 原因: PC 域合规规则禁止 /api/* (除 admin/wechat/payment/articles/ab 外)
        #   - 修复: 显式 location = /api/health 反代 nextjs, 与 H5 端行为一致
        #   - 合规: /api/health 只返 status/ts/region, 不包含 PII, PC 0 form 0 input 仍成立
        location = /api/health {
            proxy_pass http://nextjs_local/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            access_log off;
        }
        location = /robots.txt {
            proxy_pass http://nextjs_local/robots.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        # 改版 v9 (2026-07-02): /llms-full.txt 走 nextjs (动态 GEO 全文)
        location = /llms-full.txt {
            proxy_pass http://nextjs_local/llms-full.txt;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        # 改版 v19 (2026-07-10): GEO 主动推送基础设施
        #   - IndexNow key 文件 (Bing/Google/Yandex 即时索引)
        #   - sitemap-baidu.xml (百度专用 sitemap, 与 PC sitemap 分开)
        #   - 这两类文件直接由 nginx 直出, 不需要走 nextjs (减少不必要的 SSR)
        location = /yi64m5ht5e5d6iave7ugai18bidx2gkp.txt {
            root /var/www/aiwill-planner/static-content;
            charset utf-8;
            add_header Cache-Control "public, max-age=86400" always;
        }
        location = /sitemap-baidu.xml {
            alias /var/www/aiwill-planner/sitemap-baidu.xml;
            charset utf-8;
            add_header Content-Type "application/xml; charset=utf-8" always;
            add_header Cache-Control "public, max-age=3600" always;
        }
        # 修复 (2026-07-09): /manifest.webmanifest / /favicon.png 反代到 nextjs
        #   - 症状: PWA manifest 与 PNG favicon 返 404 (nginx 兜底 404)
        #   - 修复: 同 sitemap/robots 模式, 让 next.js 动态输出
        location = /manifest.webmanifest {
            proxy_pass http://nextjs_local/manifest.webmanifest;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=3600" always;
            proxy_redirect off;
        }
        location = /favicon.png {
            proxy_pass http://nextjs_local/favicon.png;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /llms.txt     { }
        location = /googleca0c92e68f0ca67c.html { }
        location = /MP_verify_ZfvMTOA5IvTKBOHF.txt { }
        # 修复 (2026-07-09): /favicon.ico 直接反代 next.js 而非 301
        location = /favicon.ico {
            proxy_pass http://nextjs_local/favicon.ico;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
            access_log off;
        }

        # 改版 v9 (2026-06-28): /wechat/bind 由 nextjs_local 直接渲染
        #   - 症状: 原配置 302 → h5.aiwill-planner.cn/wechat/bind, 但 H5 子域
        #            的回源链路 catch-all 把 /wechat/bind 也 302 回自身
        #            → 用户被夹在两个 302 之间, 浏览器中止请求 (redirs=50)
        #   - 影响: 主站 + H5 CTA "立即绑定" 全部失效, 转化漏斗首步断流
        #   - 修复: /wechat/bind 改为本地 next.js 渲染 (与 /dashboard 一致);
        #            page.tsx 已为 'use client' 且自适配移动端, 无需再跳子域
        #   - 备注: /wechat/success /wechat/callback 仍在 /wechat/ 通配下
        location = /wechat/bind {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
        }

        # ===== B) Next.js 动态路由 - 反向代理到本地 127.0.0.1:3000 =====
        # 合规说明: upstream 是 127.0.0.1, 物理上未出大陆, 不违反禁止反代境外规则;
        #          Node 进程在大陆 CVM 内部, Supabase 自建在内网.
        location ^~ /admin {
            location = /admin { proxy_pass http://nextjs_local; }
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # 改版 v12 (2026-08-01): 删除 /api/(v\d+/)?health$ 直返 200, 改用兜底 /api/ 反代
        #   - 原因: 合规手册要求大陆节点不出现任何 AI endpoint 字符串, /api/v1/health 也属切断范围
        #   - 改版 v30 (2026-08-04): 删此处的 `location /api/ { proxy_pass }` 死代码
        #     - 该 location 已被上面 line 272 的 `location /api/ { return 404 }` 兜底抢先命中
        #       (nginx 顺序匹配, 两个同前缀 location, 第一个赢), 永远不被执行
        #     - 保留会让人误以为 PC 域 /api/* 仍走 nextjs, 现已统一由 A.5 段处理
        #     - whitelist (^~ /api/admin/ /api/wechat/ /api/payment/callback /api/articles/ /api/ab/)
        #       经 longest prefix match 优先于 line 272 的普通前缀 /api/ → 不会误拦

        location /affiliate/ {
            proxy_pass http://nextjs_local;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
        location = /affiliate {
            proxy_pass http://nextjs_local/affiliate;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        # 改版 v6 (2026-06-09): /doc-type 文书类型选择器从静态页改为 next.js 动态 SSR
        #   - 原因: 用户旅程 /  →  /doc-type  →  /questionnaire
